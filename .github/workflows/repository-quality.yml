name: Repository quality

on:
  push:
    branches:
      - private-copy
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-validation:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Check development-channel metadata
        run: python tools/check_repository.py --channel development

      - name: Run combat contracts
        run: python tools/tests/test_warlock_combat_contract.py

      - name: Run executable reload and shove lifecycle tests
        run: python tools/tests/test_doomrocket_reload_lifecycle.py

      - name: Run ballistic aiming contracts
        run: python tools/tests/test_doomrocket_ballistic_aim.py

      - name: Run executable reposition lifecycle tests
        run: python tools/tests/test_doomrocket_reposition_lifecycle.py

      - name: Run projectile lifecycle contracts
        run: python tools/tests/test_doomrocket_projectile_lifecycle.py

      - name: Run sound contracts
        run: python tools/tests/test_doomrocket_sound_contract.py

      - name: Run retargeting math tests
        run: python tools/tests/test_warlock_retarget_math.py

      - name: Run texture and material source tests
        run: python tools/tests/test_warlock_texture_pipeline.py

      - name: Run kill-feed portrait contracts
        run: python tools/tests/test_doomrocket_portrait_pipeline.py

      - name: Run weapon source and contract tests
        run: python tools/tests/test_warlock_weapon_pipeline.py

      - name: Run chimney anchor source and compiled contracts
        run: python tools/tests/test_doomrocket_chimney_anchor.py

      - name: Run backpack smoke lifecycle tests
        run: python tools/tests/test_doomrocket_backpack_smoke.py

      - name: Run native chain authoring lab tests (no SDK)
        run: python tools/hose_lab/native_chain/test_native_chain.py

      - name: Run isolated compiler path guards (no SDK)
        run: python tools/hose_lab/test_compile_paths.py

      - name: Run compiled hose acceptance guard tests (no SDK)
        run: python tools/hose_lab/compiled/test_verifier.py

      - name: Run measured hose rig contract tests (no Blender)
        run: python tools/hose_lab/rig/test_contract.py

      - name: Run two-ended hose numerical tests (no engine)
        run: python tools/hose_lab/solver/test_hose_xpbd.py

      - name: Run ragdoll regression tests
        shell: pwsh
        run: ./tools/tests/Test-WarlockRagdollRegressions.ps1
