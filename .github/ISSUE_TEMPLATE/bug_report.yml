name: Development gameplay or presentation bug
description: Report a reproducible gameplay, visual, animation, audio, or multiplayer problem in the TEST build.
title: "[Bug] "
labels:
  - bug
  - needs-triage
  - dev-test
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing the experimental build. Attach the complete session log rather than pasting it into the page.

        This form is only for TEST Workshop item `3794172730`. Public-alpha reports belong in `doomrocket-public`.
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Rocket, explosion, or damage
        - Spawning, AI, shove, or aiming
        - Model, texture, ragdoll, or animation
        - Sound or visual effects
        - Multiplayer or networking
        - Other
    validations:
      required: true
  - type: input
    id: loaded_banner
    attributes:
      label: Exact loaded build banner
      description: Copy the `[doomrocket:LOAD]` line from the reproducing log.
      placeholder: "[doomrocket:LOAD] v0.1.61-dev"
    validations:
      required: true
  - type: dropdown
    id: network_role
    attributes:
      label: Your network role
      options:
        - Host
        - Remote client
        - Solo or offline
        - Unknown
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Launch with TEST item 3794172730 enabled.
        2. Start...
        3. Spawn or encounter...
        4. Observe...
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened?
      description: Include frequency and exactly what you saw or heard.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: upload
    id: console_log
    attributes:
      label: Console log
      description: Attach the complete matching file from `%APPDATA%\Fatshark\Vermintide 2\console_logs\`. Raw .log files are accepted; .txt, .zip, and .gz are also allowed (25 MB maximum).
    validations:
      required: true
      accept: ".log,.txt,.zip,.gz"
  - type: textarea
    id: media
    attributes:
      label: Screenshots or video
      description: Optional. Add continuous video when timing or repeated effects matter.
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Final checks
      options:
        - label: I restarted after the Workshop update and verified the exact loaded banner.
          required: true
        - label: The public alpha was disabled, and every lobby member used this same TEST version.
          required: true
        - label: I understand that this report and its attachments are public.
          required: true
