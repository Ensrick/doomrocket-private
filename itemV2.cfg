title = "Warlock Engineer TEST v0.1.79-dev";
description = "[h1][b]DEVELOPMENT TEST BUILD[/b][/h1]
[b]This is the unstable development version, intended for controlled playtesting and bug reproduction.[/b]

Do not enable it together with the public Warlock Engineer build. All players in a lobby must use the same version.

[url=https://steamcommunity.com/sharedfiles/filedetails/?id=3771657344]Use the public alpha here[/url]
[url=https://github.com/Ensrick/doomrocket-private/issues/new/choose]Report development-build bugs here[/url]

[h1][b][i]“The ingenious minds of Clan Skryre have developed a new device to sow explosive death from afar. Following Skratch’s failure to use the Warp Bomb and the Well of Dreams against Helmgart, Clan Fester has secured the aid of several Clan Skryre Warlock Engineers to field-test their Doomrockets—and the Ubersreik Five will make excellent target practice.”[/i][/b][/h1]

[h2]Warprocket Bombardiers[/h2]
This mod adds a new Skaven special enemy to the game: the Warprocket Bombardier, armed with a rocket launcher.

Players can shoot an incoming rocket to detonate it before it reaches its target.

[h2]Development status[/h2]
[b]This mod is still in active development.[/b] The core enemy and weapon mechanics are playable, but models, textures, animations, visual effects, sounds, balance, and multiplayer compatibility may continue to change. Expect occasional bugs and unfinished presentation while development continues.

[h2]Development test — v0.1.79-dev[/h2]
Crunch confirmed the v0.1.77-dev hose is visible and has physics. He reported that it hangs too loosely at rest. This build strengthens the curve-restoring spring while keeping gravity, damping, length constraints and secondary motion. Please report in words whether the hose now holds its intended curved shape while idle and still flexes during movement. The hose has no body or world collision and may clip.

The launcher can still sway away from the visible Engineer's hands. That mismatch is tracked as an engineering issue; it is not accepted as fixed in this build. Normal solo play now records bounded attachment-pose diagnostics in the console log to help identify the moving offset. No special recording or second player is needed.

The Engineer can shove every 2 seconds within 2.2 metres, then run away at 4 m/s. On open ground the retreat lasts 8–12 seconds and seeks at least 20 metres of separation. Blocked routes or combat interruptions may end it earlier. Please report whether his turns and foot movement look natural.

Other open TEST questions include rocket aim and near-range ground shots, aiming time, launcher sway and sound cues. Use the issue tracker for a specific report. The under-barrel crystal flame has not been added. The public alpha is unchanged.

[h2]Requirements[/h2]
[url=https://steamcommunity.com/sharedfiles/filedetails/?id=1369573612]Vermintide Mod Framework[/url] is required. In the Vermintide mod launcher, enable it and place it above Warlock Engineer TEST in the load order.

Launch the [b]Modded Realm[/b]. This mod is unsanctioned and is not available in the Official Realm.

Before reporting a result, verify that your console log contains [code][doomrocket:LOAD] v0.1.79-dev[/code]. Attach the matching log where relevant and describe what you saw or heard. Solo observations are enough; no video or recording is needed.

[h2]Installation and spawning[/h2]
Warprocket Bombardiers are enabled automatically and join the normal specials pool. The host’s conflict director spawns them according to the usual special-enemy cadence; there is no chat command to toggle them.

Every player in the lobby must have the mod installed and enabled. Only the host controls spawning.

[h2]Credits and source[/h2]
Originally created by [b]dalo_kraff[/b] and handed over to [b]Ensrick[/b] for continued development, with new character and weapon art by [b]Crunch[/b].

[url=https://github.com/Ensrick/doomrocket-private]Development source[/url]
[url=https://github.com/dalokraff/doomrocket]dalo_kraff’s original source[/url]";
