title = "Warprocket Bombardier (private copy) v0.1.31-dev";
description = "[i]''The ingenious minds of Clan Skryre have developed a new device to sow explosive death from afar. Clan Fester has been granted the privilege of field testing the new Warprockets, and the Ubersreik Five will make for excellent target practice.''[/i]

Warprocket Bombardiers are enabled automatically; there is no chat command to toggle them. They join the normal specials pool, so the host's conflict director spawns them on the usual specials cadence.
All players need the mod installed in order to play together, and only the host controls spawning.

Currently only the gameplay mechanics are near a complete state. The mesh, textures, animations and sound assets are still a WIP.

Private copy maintained for testing against the current game patch. Not the official release; see the source link below for Dalokraff's original.

