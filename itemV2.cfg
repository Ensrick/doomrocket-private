description = "[h1][b]DEVELOPMENT TEST BUILD[/b][/h1]
[b]This is the unstable development version, intended for controlled playtesting and bug reproduction.[/b]

Do not enable it together with the public Warprocket Bombardier build. All players in a lobby must use the same version.

[url=https://steamcommunity.com/sharedfiles/filedetails/?id=3771657344]Use the public alpha here[/url]
[url=https://github.com/Ensrick/doomrocket-private/issues/new/choose]Report development-build bugs here[/url]

[h1][b][i]“The ingenious minds of Clan Skryre have developed a new device to sow explosive death from afar. Following Skratch’s failure to use the Warp Bomb and the Well of Dreams against Helmgart, Clan Fester has secured the aid of several Clan Skryre Warlock Engineers to field-test their Doomrockets—and the Ubersreik Five will make excellent target practice.”[/i][/b][/h1]

[h2]Warprocket Bombardiers[/h2]
This mod adds a new Skaven special enemy to the game: the Warprocket Bombardier, armed with a rocket launcher.

Players can shoot an incoming rocket to detonate it before it reaches its target.

[h2]Development status[/h2]
[b]This mod is still in active development.[/b] The core enemy and weapon mechanics are playable, but models, textures, animations, visual effects, sounds, balance, and multiplayer compatibility may continue to change. Expect occasional bugs and unfinished presentation while development continues.

[h2]Development test — v0.1.77-dev[/h2]
The v0.1.76-dev build restored the animation callbacks, and a host tester confirms the corpse ragdolls again. Its hose still updates only once: the next frame brings the native Ratling's uniform 1.1 scale, which the endpoint guard rejected. This build accepts that validated native scale for the hose while retaining the same rig, semi-rigid physics and malformed-pose safeguards. Please check whether the hose is actually visible and flexes through movement, aiming, reload and death on both host and client. Written observations and the matching logs are enough; no recording is needed.

The Engineer can shove every 2 seconds within 2.2 metres, then run away at 4 m/s. On open ground the retreat lasts 8-12 seconds and seeks at least 20 metres of separation. Navigation now hands off between safe destinations before he stops at each one, for smoother turns. Blocked routes or combat interruptions may end it earlier. Push force, zero damage and ammunition preservation remain unchanged.

The v0.1.76-dev host log confirms the previous callback fix but shows the hose visual being removed after the 1.1-scale pose arrives. This version targets that exact rejection; visible rendering and sustained motion remain unconfirmed until you test them.

It also includes the missing network-action registration correction identified in the v0.1.65 relocation crash (#14), adds a one-second minimum aiming phase before the firing animation, and introduces chimney smoke and a semi-rigid flexible hose. These changes need host and client playtesting; they are not yet accepted as stable.

The hose flexes toward Crunch's original curved shape, follows both the pack and carried launcher, and disappears before death or weapon drops to protect the existing ragdoll behavior. This first TEST implementation has no body/world collision and limits simulation to the nearest eight Engineers within 40 metres. Please check attachment, stiffness, clipping, weapon switching, death, and multiplayer views.

The previous build has host playtest confirmation for repeated career switching without the reported crash, combat speech stopping on death, and repeated close-range shoves with no point-blank rocket firing. Remote-client verification remains outstanding.

The completed-reload fix has host playtest confirmation. Please retest kick-to-reposition on open ground and when escape is blocked, then the next shot. Rocket explosion stress and multiplayer checks remain open. The requested flame under the weapon crystal is not included.

It also replaces the old kill-feed picture with Crunch's new 60x70 Warlock Engineer portrait. Please check its colors, size, orientation, and both host/client kill feeds.

[h2]Requirements[/h2]
[url=https://steamcommunity.com/sharedfiles/filedetails/?id=1369573612]Vermintide Mod Framework[/url] is required. In the Vermintide mod launcher, enable it and place it above Warprocket Bombardier in the load order.

Launch the [b]Modded Realm[/b]. This mod is unsanctioned and is not available in the Official Realm.

Before reporting a result, verify that every participant's console log contains [code][doomrocket:LOAD] v0.1.77-dev[/code]. Attach the full host and client logs and describe what you saw or heard. No video or recording is needed.

[h2]Installation and spawning[/h2]
Warprocket Bombardiers are enabled automatically and join the normal specials pool. The host’s conflict director spawns them according to the usual special-enemy cadence; there is no chat command to toggle them.

Every player in the lobby must have the mod installed and enabled. Only the host controls spawning.

[h2]Credits and source[/h2]
