title = "Warprocket Bombardier v0.1.55-dev";
description = "[h1][b][i]“The ingenious minds of Clan Skryre have developed a new device to sow explosive death from afar. Following Skratch’s failure to use the Warp Bomb and the Well of Dreams against Helmgart, Clan Fester has secured the aid of several Clan Skryre Warlock Engineers to field-test their Doomrockets—and the Ubersreik Five will make excellent target practice.”[/i][/b][/h1]

[h2]Warprocket Bombardiers[/h2]
This mod adds a new Skaven special enemy to the game: the Warprocket Bombardier, armed with a rocket launcher.

Players can shoot an incoming rocket to detonate it before it reaches its target.

[h2]Development status[/h2]
[b]This mod is still in active development.[/b] The core enemy and weapon mechanics are playable, but models, textures, animations, visual effects, sounds, balance, and multiplayer compatibility may continue to change. Expect occasional bugs and unfinished presentation while development continues.

[h2]Installation and spawning[/h2]
Warprocket Bombardiers are enabled automatically and join the normal specials pool. The host’s conflict director spawns them according to the usual special-enemy cadence; there is no chat command to toggle them.

Every player in the lobby must have the mod installed and enabled. Only the host controls spawning.

[h2]Credits and source[/h2]
Originally created by [b]dalo_kraff[/b] and handed over to [b]Ensrick[/b] for continued development, with new character and weapon art by [b]Crunch[/b].

[url=https://github.com/dalokraff/doomrocket]Source code[/url]";
