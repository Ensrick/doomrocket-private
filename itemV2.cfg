Rocket damage is what a hero takes before talents, traits and other damage reduction. Damage drops sharply just outside 1.5 m. Other enemies take 40% less. Cataclysm 2 and 3 need a mod that unlocks them.

[h2]Development status[/h2]
[b]This mod is still in active development.[/b] The core enemy and weapon mechanics are playable, but models, textures, animations, visual effects, sounds, balance, and multiplayer compatibility may continue to change. Expect occasional bugs and unfinished presentation while development continues.

[h2]Development test - v0.1.84-dev[/h2]
Follow-ups from Crunch's test of v0.1.81 to v0.1.83:
[list]
[*]Knockback: the blast throws you into the air again with the usual flailing fall, but no longer turns your camera, so you can look around the whole time. The throw is strongest near the impact (10 m/s out and 5 m/s up within 1.5 m) and weakest at the edge of the 6 m blast (3 m/s out and 2.5 m/s up).
[*]Impacts: the rocket also detonates the moment it bounces off or scrapes anything, instead of sliding until it stops.
[*]Crystal flame: the first effect never showed. The crystal now uses the Warpfire Thrower's green ground fire, shrunk to a small flame along the crystal. Type /warlock_crystal_flame followed by a radius and a height in metres (default 0.06 0.2) in chat to resize it live, and report the values you like.
[/list]
The rest of the issue #33 balance plan from v0.1.81-dev is unchanged: 40% less rocket damage to other enemies, at least 2 seconds of aim before each shot, and Ratling Gunner health and armor (see the table above). The kill-feed portrait frame from v0.1.82-dev (issue #30) is unchanged.

v0.1.80-dev fixed the missing Dutch Spice Stormvermin waves in the Into the Nest boss arena (#35). On Legend, Dutch Spice itself crashes while loading Into the Nest because of a misspelled enemy name in its warlord spawn list; that crash happens with or without this mod, so test that arena on Cataclysm.

The firmer hose rest shape from v0.1.79-dev is unchanged. Please report in words whether the hose holds its intended curved shape while idle and still flexes during movement. The hose has no body or world collision and may clip.

The launcher can still sway away from the visible Engineer's hands. That mismatch is tracked as an engineering issue; it is not accepted as fixed in this build. Normal solo play now records bounded attachment-pose diagnostics in the console log to help identify the moving offset. No special recording or second player is needed.

The Engineer can shove every 2 seconds within 2.2 metres, then run away at 4 m/s. On open ground the retreat lasts 8–12 seconds and seeks at least 20 metres of separation. Blocked routes or combat interruptions may end it earlier. Please report whether his turns and foot movement look natural.

Other open TEST questions include rocket aim and near-range ground shots, aiming time, launcher sway and sound cues. Use the issue tracker for a specific report. The public alpha is unchanged.

[h2]Requirements[/h2]
[url=https://steamcommunity.com/sharedfiles/filedetails/?id=1369573612]Vermintide Mod Framework[/url] is required. In the Vermintide mod launcher, enable it and place it above Warlock Engineer TEST in the load order.

Launch the [b]Modded Realm[/b]. This mod is unsanctioned and is not available in the Official Realm.

Before reporting a result, verify that your console log contains [code][doomrocket:LOAD] v0.1.84-dev[/code]. Attach the matching log where relevant and describe what you saw or heard. Solo observations are enough; no video or recording is needed.

[h2]Installation and spawning[/h2]
Warprocket Bombardiers are enabled automatically and join the normal specials pool. The host’s conflict director spawns them according to the usual special-enemy cadence; there is no chat command to toggle them.

Every player in the lobby must have the mod installed and enabled. Only the host controls spawning.

