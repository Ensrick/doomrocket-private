Rocket damage is what a hero takes before talents, traits and other damage reduction. Damage drops sharply just outside 1.5 m. Other enemies take 40% less. Cataclysm 2 and 3 need a mod that unlocks them.

[h2]Development TEST - v0.1.96-dev[/h2]
This mod is in active development. Expect unfinished presentation and occasional bugs. The current update addresses Crunch's v0.1.94-dev feedback:
[list]
[*]First-spawn hitch (#69): effect packages load asynchronously. Please report whether the first Warlock still causes a noticeable hitch and whether smoke and flame appear once loaded.
[*]Gem flame (#15): the existing native torch is green and targets 40% of its previous dimensions. Please report colour, size, attachment and cleanup at death or weapon drop. The correct torch being visible is already accepted; no tuning command is needed.
[*]Hose (#3): damping follows the moving rest shape to reduce airborne flapping while walking. Secondary physics, gravity, inertia, endpoint tracking and length constraints remain. Please report whether it moves with more weight while retaining natural flex. It has no body, wall or self-collision and may clip.
[/list]
Rendered appearance and native performance need in-game verdicts. Original animation clips, tracks, visible transitions and custom poses are preserved; no new production art or animation is added.

Crunch accepted the v0.1.94-dev ordinary-spawn crash fix (#65), the #33 balance changes and the #30 portrait frame. Those accepted checks need no repeat. Issue #53 provides the optional controller rehearsal; final authored clips and localized outfit acceptance remain separate.

Other remaining observations:
[list]
[*]Audio (#5, #44): approved recordings remain 30% quieter than v0.1.88-dev. Report loudness in ordinary play and lingering speech, machinery or launch sounds after death. New wind-up, flight and reload recordings remain Arnaud's asset work.
[*]Rocket clearance (#6): report whether close shots clear the floor and reach the aimed point.
[*]Weapon grip (#28): report launcher/hand alignment during movement, aiming and reload, and whether the torso and elbows look natural. Unsupported custom jump clips remain asset work.
[*]Dutch Spice arena (#35): check Into the Nest Stormvermin waves on Cataclysm. Dutch Spice's separate Legend breed-name typo is not fixed here.
[/list]

The Engineer can shove every 2 seconds within 2.2 metres, then retreat at 4 m/s. On open ground he retreats for 8-12 seconds, seeking at least 20 metres of separation. Blocked routes and interruptions may end it earlier.

[h2]Requirements and testing[/h2]
[url=https://steamcommunity.com/sharedfiles/filedetails/?id=1369573612]Vermintide Mod Framework[/url] is required. Enable it above Warlock Engineer TEST in the mod load order. Launch the [b]Modded Realm[/b]; this unsanctioned mod cannot run in the Official Realm.

Confirm [code][doomrocket:LOAD] v0.1.96-dev[/code] in your new console log before judging this update. Describe what you saw or heard and attach the matching log where relevant. Solo written observations suffice; no video, recording or arranged lobby is needed. For crashes, include the GUID/Crashify link. Use the issue tracker for current instructions. Public alpha is unchanged.

[h2]Installation and spawning[/h2]
Warprocket Bombardiers automatically join the normal specials pool. Only the host controls spawning through the usual special-enemy cadence; there is no chat toggle. Everyone in a lobby must have the same channel and exact version installed and enabled.

