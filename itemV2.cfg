Rocket damage is what a hero takes before talents, traits and other damage reduction. Damage drops sharply just outside 1.5 m. Other enemies take 40% less. Cataclysm 2 and 3 need a mod that unlocks them.

[h2]Development status[/h2]
[b]This mod is still in active development.[/b] The core enemy and weapon mechanics are playable, but models, textures, animations, visual effects, sounds, balance, and multiplayer compatibility may continue to change. Expect occasional bugs and unfinished presentation while development continues.

[h2]Development test - v0.1.92-dev[/h2]
v0.1.92-dev corrects an offline animation-evidence helper check. It keeps v0.1.91-dev's gameplay, native flame candidate, animation tracks and custom-pose ownership unchanged. Native custom-animation playback still requires the separate staged integration; no new in-game pass is claimed.

v0.1.91-dev tries the game's small hand-torch effect at the crystal, using its native emitter dimensions rather than the rejected ground-fire size controls. Please report its visible size, colour and attachment during normal play. This build also reduces duplicate skeleton checks in the separately staged custom-animation path while preserving existing tracks, custom poses and safety guards. It retains v0.1.90-dev's quieter audio, slight hose adjustment, aim guards and facing diagnostics. The animator rig, authored clips and localized coat/belt skin remain separate candidates with matching registration; no diagnostic animation replaces the enemy's existing moves.

Candidates addressing Crunch's current reports:
[list]
[*]Audio: death and teardown stop the exact owned playback instances and check that they went silent. The existing approved recordings play 30% quieter than v0.1.88-dev. Please report any lingering machinery, combat speech or launch sound after death, and how the loudness feels in normal play.
[*]Rocket clearance: target height accounts for the actual rocket hull, and the rocket starts along its flight direction without the old globe spin. Near-range ground shots need a written verdict on this build.
[*]Crystal flame: a small native hand-torch candidate replaces the rejected ground-fire effect. Please describe whether its size, colour and motion suit the crystal and whether it disappears at death or weapon drop. Its appearance is not yet accepted. No size-tuning commands are needed.
[*]Weapon grip: a bounded upper-body pose transfer addresses ordinary walking, running, aiming, firing and reload separation. Please report whether the launcher stays in the hands and the torso/elbows look natural. Missing custom jump clips remain asset work; the transfer skips unsupported events.
[/list]
Crunch accepted the existing knockback/contact changes and the rest of the issue #33 balance plan: 40% less rocket damage to other enemies, at least 2 seconds of aim before each shot, and Ratling Gunner health and armor (see the table above). The kill-feed portrait frame (#30) is also accepted.

v0.1.80-dev fixed the missing Dutch Spice Stormvermin waves in the Into the Nest boss arena (#35). On Legend, Dutch Spice itself crashes while loading Into the Nest because of a misspelled enemy name in its warlord spawn list; that crash happens with or without this mod, so test that arena on Cataclysm.

The hose's rest-shape spring is slightly firmer than before, with its gravity, inertia, damping and length constraints retained. Please report in words whether the hose holds its intended curved shape while idle and still flexes during movement. The hose has no body or world collision and may clip.

The grip correction is a visual candidate, not an accepted in-game fix. Normal solo play records bounded attachment-pose diagnostics after current scene transforms are updated. No special recording or second player is needed.

The Engineer can shove every 2 seconds within 2.2 metres, then run away at 4 m/s. On open ground the retreat lasts 8–12 seconds and seeks at least 20 metres of separation. Blocked routes or combat interruptions may end it earlier. Please report whether his turns and foot movement look natural.

Dedicated wind-up, flight-loop and reload insertion/latch recordings remain asset work for Arnaud. Use the issue tracker for current test instructions. The public alpha is unchanged.

[h2]Requirements[/h2]
[url=https://steamcommunity.com/sharedfiles/filedetails/?id=1369573612]Vermintide Mod Framework[/url] is required. In the Vermintide mod launcher, enable it and place it above Warlock Engineer TEST in the load order.

Launch the [b]Modded Realm[/b]. This mod is unsanctioned and is not available in the Official Realm.

Before reporting a result, verify that your console log contains [code][doomrocket:LOAD] v0.1.92-dev[/code]. Attach the matching log where relevant and describe what you saw or heard. Solo observations are enough; no video or recording is needed.

[h2]Installation and spawning[/h2]
Warprocket Bombardiers are enabled automatically and join the normal specials pool. The host’s conflict director spawns them according to the usual special-enemy cadence; there is no chat command to toggle them.

Every player in the lobby must have the mod installed and enabled. Only the host controls spawning.

