title = "Warprocket Bombardier TEST v0.1.61-dev";
description = "[h1][b]DEVELOPMENT TEST BUILD[/b][/h1]
[b]This is the unstable development version, intended for controlled playtesting and bug reproduction.[/b]

Do not enable it together with the public Warprocket Bombardier build. All players in a lobby must use the same version.

[url=https://steamcommunity.com/sharedfiles/filedetails/?id=3771657344]Use the public alpha here[/url]
[url=https://github.com/Ensrick/doomrocket-private/issues/new/choose]Report development-build bugs here[/url]

[h1][b][i]“The ingenious minds of Clan Skryre have developed a new device to sow explosive death from afar. Following Skratch’s failure to use the Warp Bomb and the Well of Dreams against Helmgart, Clan Fester has secured the aid of several Clan Skryre Warlock Engineers to field-test their Doomrockets—and the Ubersreik Five will make excellent target practice.”[/i][/b][/h1]

[h2]Warprocket Bombardiers[/h2]
This mod adds a new Skaven special enemy to the game: the Warprocket Bombardier, armed with a rocket launcher.

Players can shoot an incoming rocket to detonate it before it reaches its target.

[h2]Development status[/h2]
[b]This mod is still in active development.[/b] The core enemy and weapon mechanics are playable, but models, textures, animations, visual effects, sounds, balance, and multiplayer compatibility may continue to change. Expect occasional bugs and unfinished presentation while development continues.

[h2]Latest test build — v0.1.61-dev[/h2]
This crash-fix candidate makes every projectile detonation a one-way transition, removes the rocket before fallible impact work, and sends exactly one explosion request for the engine to process in its safe network/damage phase. It targets the repeated detonation and stale-position failure reported in development issue #8. Offline checks pass, but this remains a runtime test candidate—not a confirmed in-game fix.

The custom sound bank remains under active investigation and must not be considered complete until an in-game log confirms that every event registered and played.

[h2]Requirements[/h2]
[url=https://steamcommunity.com/sharedfiles/filedetails/?id=1369573612]Vermintide Mod Framework[/url] is required. In the Vermintide mod launcher, enable it and place it above Warprocket Bombardier in the load order.

Launch the [b]Modded Realm[/b]. This mod is unsanctioned and is not available in the Official Realm.

Before reporting a TEST result, verify that the console log contains [code][doomrocket:LOAD] v0.1.61-dev[/code].

[h2]Installation and spawning[/h2]
Warprocket Bombardiers are enabled automatically and join the normal specials pool. The host’s conflict director spawns them according to the usual special-enemy cadence; there is no chat command to toggle them.

Every player in the lobby must have the mod installed and enabled. Only the host controls spawning.

[h2]Credits and source[/h2]
Originally created by [b]dalo_kraff[/b] and handed over to [b]Ensrick[/b] for continued development, with new character and weapon art by [b]Crunch[/b].

